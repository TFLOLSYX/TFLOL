<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>TFLOL Unblocker</title>
    
    <!-- Permanent direct reference to your working lowercase logo filename -->
    <link rel="icon" type="image/png" href="./image_DVjCen.png">
    <link rel="shortcut icon" type="image/png" href="./image_DVjCen.png">
    
    <style>
        :root {
            --bg-color: #050508;
            --container-color: #120202;
            --border-color: #380a0a;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-secondary: #a3a3a3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; position: relative; }
        header { background-color: var(--container-color); padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); gap: 1rem; }
        .logo-container { display: flex; align-items: center; gap: 0.8rem; }
        .custom-logo { height: 35px; width: auto; max-width: 45px; object-fit: contain; display: block; }
        .logo-text { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); text-shadow: 0 0 10px rgba(229, 9, 20, 0.4); white-space: nowrap; }
        .search-container { flex: 0 1 400px; }
        .search-container input { width: 100%; padding: 0.6rem 1rem; border-radius: 20px; border: 1px solid var(--border-color); background-color: #000000; color: var(--text-color); outline: none; transition: all 0.3s; }
        .search-container input:focus { border-color: var(--accent-color); box-shadow: 0 0 8px rgba(229, 9, 20, 0.3); }
        main { flex: 1; padding: 2rem; max-width: 1200px; width: 100%; margin: 0 auto; }
        
        /* Hidden Game Box Frame Container Layout Rules */
        .player-container { display: none; background-color: #000000; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 2rem; overflow: hidden; }
        .iframe-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; }
        .iframe-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        /* Control Bar Strip directly beneath running game screen */
        .player-bar { background-color: var(--container-color); padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); }
        .player-title { font-size: 1.05rem; font-weight: 600; color: #ffffff; }
        .fs-btn { background-color: #000000; color: #ffffff; border: 1px solid var(--border-color); padding: 0.5rem 1.2rem; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: all 0.2s; }
        .fs-btn:hover { background-color: var(--accent-color); border-color: var(--accent-color); box-shadow: 0 0 8px rgba(229, 9, 20, 0.4); }
        
        /* Library Selection Grid Options */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
        .game-card { background-color: var(--container-color); border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid var(--border-color); }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(229, 9, 20, 0.25); border-color: var(--accent-color); }
        .game-thumb { width: 100%; height: 130px; background-color: #000000; border-bottom: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; }
        .heart-icon { font-size: 4.5rem; filter: drop-shadow(0 0 10px rgba(229, 9, 20, 0.3)); }
        .game-info { padding: 0.8rem; }
        .game-title { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-category { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.2rem; }
        
        /* Floating Widget Credits Overlay Separated From Main Content */
        .floating-credits { position: fixed; bottom: 4.5rem; right: 1.5rem; background-color: var(--container-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.6rem 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.6); z-index: 9999; }
        .credits-text-label { font-size: 0.8rem; text-transform: uppercase; color: var(--accent-color); letter-spacing: 0.5px; font-weight: bold; margin-bottom: 2px; }
        .credits-developer { font-size: 0.9rem; font-weight: 600; color: var(--text-color); }
        
        footer { background-color: var(--container-color); text-align: center; padding: 1rem; font-size: 0.9rem; color: var(--text-secondary); border-top: 2px solid var(--border-color); margin-top: auto; }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="./image_DVjCen.png" alt="Logo" class="custom-logo">
            <span class="logo-text">TFLOL Unblocker</span>
        </div>
        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Search available apps..." onkeyup="filterGames()">
        </div>
    </header>
    <main>
        <!-- The Game Player Window Component -->
        <section class="player-container" id="playerContainer">
            <div class="iframe-wrapper">
                <iframe id="gameIframe" src="" allowfullscreen scrolling="no" allow="autoplay; gamepad *; fullscreen *;"></iframe>
            </div>
            <div class="player-bar">
                <span class="player-title" id="activeGameTitle">Deltarune Web Port</span>
                <button class="fs-btn" onclick="goFullscreen()">⛶ Fullscreen</button>
            </div>
        </section>

        <h2 style="margin-bottom: 1.5rem; border-left: 4px solid var(--accent-color); padding-left: 0.5rem;">Applications Library</h2>
        <section class="games-grid" id="gamesGrid"></section>
    </main>

    <!-- Isolated Floating Credits Widget Structure Component -->
    <div class="floating-credits">
        <div class="credits-text-label">Lead Dev</div>
        <div class="credits-developer">TFLOLSYX</div>
    </div>

    <footer>&copy; 2026 TFLOL Hub. Personal deployment portal.</footer>
    <script>
        // LOCKED BACK IN: Re-mapped to the working WebAssembly deployment repository link node
        const games = [{
            title: "Deltarune Web Port",
            category: "RPG",
            htmlContent: '<div class="heart-icon">❤️</div>',
            url: "https://mollomm1.github.io/test/"
        },
        {
            title: "Mario 64 webport",
            category: "Platformer",
            htmlContent: '⭐',
            url: "./mario64.html"
        },
        {
            title: "Geometry Dash",
            category: "Platformer",
            htmlContent: '🟨',
            url: "./geometrydash.html"
        }];
        
        const gamesGrid = document.getElementById('gamesGrid');
        const playerContainer = document.getElementById('playerContainer');
        const gameIframe = document.getElementById('gameIframe');
        const activeGameTitle = document.getElementById('activeGameTitle');

        function loadGames(gamesToRender) {
            gamesGrid.innerHTML = "";
            if (gamesToRender.length === 0) {
                gamesGrid.innerHTML = "<p style='color: var(--text-secondary)'>No items matches search parameters.</p>";
                return;
            }
            gamesToRender.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => launchGame(game.title, game.url);
                card.innerHTML = `
                    <div class="game-thumb">${game.htmlContent}</div>
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <div class="game-category">${game.category}</div>
                    </div>`;
                gamesGrid.appendChild(card);
            });
        }

        function launchGame(title, url) {
            activeGameTitle.textContent = title;
            gameIframe.src = url;
            playerContainer.style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Forces input focus directly into the active engine layout frame upon card click
            gameIframe.onload = function() {
                setTimeout(() => {
                    gameIframe.contentWindow.focus();
                }, 100);
            };
        }

        function goFullscreen() {
            const iframe = document.getElementById('gameIframe');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            }
        }

        // Initialize the library grid display on page load
        loadGames(games);

        // Simple filtering function for the search layout
        function filterGames() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = games.filter(game => 
                game.title.toLowerCase().includes(query) || 
                game.category.toLowerCase().includes(query)
            );
            loadGames(filtered);
        }
    </script>
</body>
</html>
